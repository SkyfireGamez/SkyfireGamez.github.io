<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moderation Tool Bypassing</title>
  <style>
    body {
      font-family: sans-serif;
      background: #0d0d0d;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      margin: 0;
    }
    input, textarea, button {
      width: 100%;
      max-width: 600px;
      font-size: 1rem;
      margin: 10px 0;
      padding: 12px;
      border-radius: 8px;
      border: none;
      outline: none;
      box-sizing: border-box;
    }
    textarea {
      height: 150px;
      resize: vertical;
    }
    button {
      background: #1f1f1f;
      color: #fff;
      cursor: pointer;
      transition: 0.2s ease;
    }
    button:hover {
      background: #333;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      width: 100%;
      max-width: 600px;
    }
    .row input[type="number"] {
      width: 80px;
    }
    .note {
      font-size: 0.9rem;
      max-width: 600px;
      margin-top: -5px;
      margin-bottom: 15px;
    }
    .note.safe {
      color: #7fff7f;
    }
    .note.warning {
      color: #ff6b6b;
    }
    #quick-shortcuts-container {
      display: flex;
      flex-wrap: wrap;
      max-width: 600px;
      gap: 10px;
      margin-top: 10px;
      justify-content: flex-start;
    }
    .shortcut-row {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: flex-start;
      margin-bottom: 10px;
    }
    .shortcut-btn {
      background: #1f1f1f;
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      font-size: 0.9rem;
      white-space: nowrap;
      flex: 1 0 calc(33.333% - 10px);
      justify-content: center;
      transition: background 0.2s ease;
    }
    .shortcut-btn:hover {
      background: #333;
    }
    .status-icon {
      font-weight: bold;
      font-size: 1.1rem;
      user-select: none;
    }
    .status-yes {
      color: #7fff7f;
    }
    .status-no {
      color: #ff4c4c;
    }
    @media (max-width: 768px) {
      body { padding: 20px; }
      h1 { font-size: 1.5rem; }
      input, textarea, button {
        font-size: 0.9rem;
        padding: 10px;
      }
      textarea { height: 120px; }
      .row { flex-direction: column; align-items: stretch; }
      .shortcut-row { flex-direction: column; align-items: stretch; }
      .shortcut-btn {
        flex: 1 0 100%;
        justify-content: center;
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <div id="motd" class="note" style="color: #7fafff;">Loading message of the day...</div>
  <h1>Bypass TikTok's Moderation</h1>
  <input id="userInput" placeholder="Enter text here..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
  
  <div class="row">
    <input type="number" id="repeatAmount" placeholder="Repeat" value="5" min="1" />
    <button onclick="spamify()">Spam it</button>
  </div>
  <div id="note" class="note">Enter text to see the message status.</div>

  <textarea id="result" readonly></textarea>
  <button onclick="copyResult()">Copy Result</button>

  <div id="quick-shortcuts-container" aria-label="Quick shortcuts"></div>

  <script>
    const charLimit = window.innerWidth <= 768 ? 100 : 150;
    const invisibleChar = "︀";

    function spamify() {
      const input = document.getElementById("userInput").value;
      const repeatCount = parseInt(document.getElementById("repeatAmount").value) || 30;
      if (!input) return alert("Please enter some text!");
      const spam = invisibleChar.repeat(repeatCount);
      let result = "";
      for (let i = 0; i < input.length; i++) {
        result += input[i];
        if (i !== input.length - 1) result += spam;
      }
      document.getElementById("result").value = result;
      updateNote(result.length);
      fetch("/log", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ result }) }).catch(() => {});
    }

    function updateNote(length) {
      const note = document.getElementById("note");
      if (length >= charLimit) {
        note.textContent = `This message won't be able to be used on live. (Limit is ${charLimit} characters on your device)`;
        note.className = "note warning";
      } else {
        note.textContent = `You can use this in comments and in live! (Limit is ${charLimit} characters on your device)`;
        note.className = "note safe";
      }
    }

    async function copyResult() {
      const resultText = document.getElementById("result").value;
      if (!resultText) return alert("Nothing to copy!");
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(resultText);
          alert("Copied to clipboard!");
        } catch {
          fallbackCopy(resultText);
        }
      } else {
        fallbackCopy(resultText);
      }
    }

    function fallbackCopy(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      document.body.appendChild(textArea);
      textArea.select();
      document.execCommand('copy');
      document.body.removeChild(textArea);
      alert("Copied to clipboard!");
    }

    async function loadQuickShortcuts() {
      try {
        const res = await fetch('/quickmenu/list');
        if (!res.ok) throw new Error(`Failed to load shortcuts: ${res.status}`);
        const shortcuts = await res.json();
        renderShortcuts(shortcuts);
      } catch {
        document.getElementById('quick-shortcuts-container').textContent = "Failed to load quick shortcuts.";
      }
    }

    function renderShortcuts(shortcuts) {
      const container = document.getElementById('quick-shortcuts-container');
      container.innerHTML = "";
      const mobile = window.innerWidth <= 768;
      const itemsPerRow = mobile ? 1 : 3;
      let rowDiv = null;
      shortcuts.forEach((item, index) => {
        if (index % itemsPerRow === 0) {
          rowDiv = document.createElement('div');
          rowDiv.className = 'shortcut-row';
          container.appendChild(rowDiv);
        }
        const btn = document.createElement('button');
        btn.className = 'shortcut-btn';
        btn.appendChild(document.createTextNode(item.displayText + " "));
        const statusSpan = document.createElement('span');
        statusSpan.className = 'status-icon';
        const limit = mobile ? 100 : 150;
        if (item.fullText.length > limit) {
          statusSpan.textContent = "❌";
          statusSpan.classList.add('status-no');
        } else {
          statusSpan.textContent = "✅";
          statusSpan.classList.add('status-yes');
        }
        btn.appendChild(statusSpan);
        btn.onclick = async () => {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(item.fullText);
            alert("Copied to clipboard!");
          } else {
            fallbackCopy(item.fullText);
          }
        };
        rowDiv.appendChild(btn);
      });
    }

    loadQuickShortcuts();
    setInterval(loadQuickShortcuts, 2000);

    async function loadMOTD() {
      try {
        const res = await fetch('/motd');
        if (!res.ok) throw new Error(`Failed to load MOTD: ${res.status}`);
        const motdText = await res.text();
        document.getElementById('motd').textContent = motdText || "(No MOTD set)";
      } catch {
        document.getElementById('motd').textContent = "Error loading message of the day.";
      }
    }
    loadMOTD();
    setInterval(loadMOTD, 2000);
  </script>
</body>
</html>
